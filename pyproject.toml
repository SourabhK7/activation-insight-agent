[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Deliberately narrow. Style enforcement is fine but this repo is not
# large enough to justify aggressive rules. Focus on real bugs.
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line-too-long: we let ruff format decide, not the linter yell
    "E731",   # lambda assignments are fine here
]

[tool.ruff.lint.isort]
known-first-party = ["activation_agent", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]
